<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz'in – Émetteur Cast de test</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
      google-cast-launcher { display: inline-block; width: 40px; height: 40px; cursor: pointer; }
      input, button { font-size: 1.2rem; padding: 0.4rem 0.8rem; max-width: 100%; }
      #status { margin-top: 1rem; white-space: pre-line; }
    </style>
  </head>
  <body>
    <!-- Outil de développement (npm run dev) : remplace l'app de l'hôte pour tester le récepteur
         Cast sur la TV. Absent du site déployé (seul index.html est construit). -->
    <h1>Émetteur Cast de test</h1>
    <p>1. Connexion à la TV : <google-cast-launcher></google-cast-launcher></p>
    <p>
      2. Code de la partie :
      <input id="code" maxlength="4" size="6" autocomplete="off" />
      <button id="send">Envoyer le code</button>
    </p>
    <p>
      3. Test du son (blind test) : adresse d'un extrait (valable environ 15 min)<br />
      <input id="audio-url" size="40" autocomplete="off" placeholder="https://cdnt-preview.dzcdn.net/…" />
      <button id="audio-test">Tester le son</button>
    </p>
    <p>
      4. Effets et musiques (Web Audio) : <button id="sound-effects">Tester les effets</button><br />
      Fichier déployé avec la TV (music/…) ou adresse https :
      <input id="music-file" size="40" autocomplete="off" placeholder="music/essai.ogg" />
      <button id="sound-music">Tester la musique</button>
    </p>
    <p id="status">Chargement du SDK Cast…</p>
    <script type="module" src="/src/dev/castSender.ts"></script>
  </body>
</html>
